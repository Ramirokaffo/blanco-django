{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titre %}Blanco{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;padding:32px;">
                    <tr>
                        <td>
                            <p style="margin:0 0 24px;font-size:20px;font-weight:600;color:#0b7285;">Blanco</p>
                            {% block contenu %}{% endblock %}
                            <hr style="border:none;border-top:1px solid #e4e7eb;margin:32px 0 16px;">
                            <p style="margin:0;font-size:12px;color:#7b8794;">
                                {% trans "Ce message vous est envoyé automatiquement. Merci de ne pas y répondre." %}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
