# Compile l'application de bureau Windows et publie une release GitHub.
#
# Déclenchement par tag :
#   test-v1.2.3  → préversion : installeur Blanco-Setup-1.2.3-test.exe,
#                  release marquée « pre-release ».
#   prod-v1.2.3  → production : Blanco-Setup-1.2.3.exe, release normale.
#
#   git tag test-v1.2.3 && git push origin test-v1.2.3
#
# Le job réutilise installer/build_windows.ps1, le script de compilation
# manuelle : ce qui est publié sort du même chemin que ce qu'on obtient sur
# son propre poste.

name: Build Windows

on:
  push:
    tags:
      - 'test-v*'
      - 'prod-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à compiler (ex. 1.2.3)"
        required: true
        default: '0.0.0'
      channel:
        description: "Canal"
        required: true
        default: 'test'
        type: choice
        options: [test, prod]

# Nécessaire pour créer la release ; aucune autre permission.
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  # Les messages du projet contiennent des emojis ; sur un runner Windows la
  # sortie est un pipe encodé en cp1252. configure_console() (blanco/console.py)
  # empêche le plantage, et PYTHONUTF8 garde les messages intacts dans les logs.
  PYTHONUTF8: '1'

  # blanco.settings exige ces variables pour makemigrations / collectstatic /
  # les tests. Elles ne servent qu'à la compilation : l'application installée
  # génère son propre .env dans %LOCALAPPDATA%\Blanco au premier démarrage.
  SECRET_KEY: ci-build-only-secret-key-not-shipped
  DEBUG: 'False'
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_ENGINE: django.db.backends.sqlite3
  MYSQL_DATABASE: ''
  MYSQL_USER: ''
  MYSQL_PASSWORD: ''
  MYSQL_HOST: ''
  MYSQL_PORT: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version et le canal
        id: meta
        shell: pwsh
        env:
          # Passer par l'environnement plutôt qu'interpoler ${{ }} dans le
          # script : un nom de tag ne doit pas pouvoir devenir du code.
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:REF_NAME -match '^(test|prod)-v(.+)$') {
              $channel = $Matches[1].ToLower()
              $version = $Matches[2]
            }
            else {
              throw "Tag non reconnu : $env:REF_NAME (attendu test-v* ou prod-v*)"
            }
            $isRelease = 'true'
          }
          else {
            $channel = $env:INPUT_CHANNEL
            $version = $env:INPUT_VERSION
            $isRelease = 'false'
          }

          # Inno Setup et Windows attendent un numéro de version simple.
          if ($version -notmatch '^[0-9]+(\.[0-9]+){0,3}$') {
            throw "Version invalide : '$version' (attendu 1, 1.2, 1.2.3 ou 1.2.3.4)"
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_release=$isRelease" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $version — canal $channel — release $isRelease"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt

      - name: Environnement virtuel et dépendances
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-windows.txt

      - name: Générer les migrations
        shell: pwsh
        # Les migrations ne sont pas versionnées (.gitignore) : sans cette
        # étape, tests et compilation échouent sur « Dependency on app with
        # no migrations: core ».
        run: venv\Scripts\python.exe manage.py makemigrations core --noinput

      - name: Tests
        shell: pwsh
        # Barrière avant publication : pas d'installeur livré sur une suite rouge.
        run: venv\Scripts\python.exe manage.py test core

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compiler l'exécutable et l'installeur
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force -ErrorAction SilentlyContinue
          installer\build_windows.ps1 `
            -Version '${{ steps.meta.outputs.version }}' `
            -Channel '${{ steps.meta.outputs.channel }}' `
            -RequireInstaller `
            -Clean

      - name: Archiver la version portable
        shell: pwsh
        # Variante sans installeur : le dossier se copie sur une clé USB et
        # Blanco.exe se lance tel quel.
        run: |
          $name = "Blanco-${{ steps.meta.outputs.version }}-portable.zip"
          Compress-Archive -Path dist\Blanco\* -DestinationPath $name -CompressionLevel Optimal

      - name: Publier les artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: blanco-windows-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.channel }}
          path: |
            installer/Output/*.exe
            *-portable.zip
          retention-days: 30
          if-no-files-found: error

      - name: Créer la release GitHub
        if: steps.meta.outputs.is_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          $notes = (Get-Content '.github/release-notes-template.md' -Raw).Replace('{{VERSION}}', $env:VERSION)

          if ($env:CHANNEL -eq 'test') {
            $warning = "> **Préversion — poste de test.** Une mise à jour applique ses migrations " +
                       "à la base existante, sans retour arrière possible : sauvegardez " +
                       "``%LOCALAPPDATA%\Blanco`` avant de l'installer sur un poste réel.`n`n"
            $notes = $warning + $notes
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          $files = @()
          $files += Get-ChildItem 'installer\Output\*.exe' | ForEach-Object { $_.FullName }
          $files += Get-ChildItem '*-portable.zip' | ForEach-Object { $_.FullName }

          # Relancer le job sur un tag déjà publié ne doit pas échouer :
          # on remplace les fichiers de la release existante.
          $previous = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previous

          if ($exists) {
            Write-Host "Release $env:TAG déjà présente : mise à jour des fichiers."
            $ghArgs = @('release', 'upload', $env:TAG) + $files + @('--clobber')
          }
          else {
            $ghArgs = @('release', 'create', $env:TAG,
                        '--title', "Blanco $env:VERSION",
                        '--notes-file', 'release-notes.md')
            if ($env:CHANNEL -eq 'test') {
              $ghArgs += '--prerelease'
            }
            $ghArgs += $files
          }

          Write-Host "gh $($ghArgs -join ' ')"
          gh @ghArgs
